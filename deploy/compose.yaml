name: shirone-blog
services:
  web:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: shirone-blog
    user: node
    working_dir: /site
    command: [node, /site/current/server.cjs]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=64
      SITE_ROOT: /site/current/dist
      PORT: "3103"
    volumes:
      - /srv/shirone-blog/site:/site:ro
    expose: ["3103"]
    networks: [ingress]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3103/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  ingress:
    external: true
    name: blogweb_default
