# Merge with the existing ingress Compose file; no separate blog container.
# docker compose -f /srv/drive-service/compose.yaml \
#   -f /srv/shirone-blog/compose.yaml up -d --no-deps nginx
services:
  nginx:
    volumes:
      - /srv/shirone-blog/site:/site:ro
      - /srv/shirone-blog/nginx-blog.conf:/etc/nginx/snippets/shirone-blog.conf:ro
