# Include inside the existing blog.zhiii.top HTTPS server block.
# Mount the parent directory so atomic current/previous symlink swaps stay visible.
root /site/current/dist;
index index.html;
autoindex off;
open_file_cache off;
disable_symlinks on from=$document_root;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control no-cache always;

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

error_page 404 /404.html;
error_page 405 = @blog_method_not_allowed;

location @blog_method_not_allowed {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
    add_header Allow "GET, HEAD" always;
    return 405;
}

location = /healthz {
    # This fixed, non-public metadata path intentionally follows current.
    alias /site/current/health.json;
    disable_symlinks off;
    default_type application/json;
}

location ~ (^|/)\. {
    return 404;
}

location /_astro/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /atom.xml {
    types { }
    default_type "application/atom+xml; charset=utf-8";
}

location = /rss.xml {
    types { }
    default_type "application/rss+xml; charset=utf-8";
}

location ~ ^/llms[^/]*\.txt$ {
    types { }
    default_type "text/markdown; charset=utf-8";
}

location / {
    try_files $uri $uri.html $uri/ =404;
}
