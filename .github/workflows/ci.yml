name: Shirone theme checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  repository_dispatch:
    types: [music-updated]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    name: Public theme checks (no private content)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      CONTENT_DIR: artifacts/vault-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize blog content
        run: |-
          node tools/vault/fixture.mjs
          node scripts/content/sync.mjs
      - name: Run Biome
        run: pnpm exec biome ci ./src --reporter=github
      - name: Check Astro diagnostics
        run: pnpm exec astro check
      - name: Validate atom manifest
        run: pnpm check:manifest
      - name: Check TypeScript declarations
        run: pnpm type-check
      - name: Run unit tests
        run: node --test --test-concurrency=1 "tests/**/*.test.mjs"
      - name: Validate static release and Nginx HTTP contracts
        run: |
          python3 tests/deploy/release.test.py
          python3 tests/deploy/nginx.test.py
      - name: Build production site
        run: pnpm build
      - name: Notify private content publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CONTENT_WRITE_KEY: ${{ secrets.CONTENT_WRITE_KEY }}
          CMS_GITHUB_KNOWN_HOSTS: ${{ vars.CMS_GITHUB_KNOWN_HOSTS }}
        run: |-
          test -n "$CONTENT_WRITE_KEY" && test -n "$CMS_GITHUB_KNOWN_HOSTS"
          printf '%s\n' "$CONTENT_WRITE_KEY" > "$RUNNER_TEMP/cms-content-write"
          chmod 600 "$RUNNER_TEMP/cms-content-write"
          printf '%s\n' "$CMS_GITHUB_KNOWN_HOSTS" > "$RUNNER_TEMP/cms-github-known-hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/cms-content-write -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/cms-github-known-hosts -o StrictHostKeyChecking=yes"
          node tools/vault/notify-content.mjs
          rm -f "$RUNNER_TEMP/cms-content-write"
