name: Publish blog

on:
  push:
    branches: [main]
    paths: ['content/**', 'cms/**', 'config/**', 'data/**', 'assets/**', 'public/**', 'shirone.content.json', '.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional full content SHA for an explicit rollback
        required: false
        type: string
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: private-publication
  cancel-in-progress: false

env:
  CONTENT_REPO_URL: https://github.com/Zhaozhiii/Shirone-Zh-CMS.git

jobs:
  build:
    name: Validate and build private content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code_sha: ${{ steps.versions.outputs.code_sha }}
      content_sha: ${{ steps.versions.outputs.content_sha }}
      release_sha: ${{ steps.versions.outputs.release_sha }}
    steps:
      - name: Checkout exact content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.content_sha || github.event.client_payload.sha || github.sha }}
          path: content
          persist-credentials: false
      - name: Resolve current theme
        id: theme
        run: |
          code="$(git ls-remote https://github.com/Zhaozhiii/shirone-Zh.git refs/heads/main | cut -f1)"
          [[ "$code" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$code" >> "$GITHUB_OUTPUT"
      - name: Checkout exact theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Zhaozhiii/shirone-Zh
          ref: ${{ steps.theme.outputs.sha }}
          path: theme
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.14.4
          run_install: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml
      - name: Lock immutable release versions
        id: versions
        working-directory: theme
        run: |
          CODE_SHA="$(git rev-parse HEAD)" CONTENT_SHA="$(git -C ../content rev-parse HEAD)" node --input-type=module -e 'import {releaseVersion} from "./scripts/deploy/release-version.mjs"; import {appendFileSync} from "node:fs"; const {CODE_SHA:c,CONTENT_SHA:d,GITHUB_OUTPUT:o}=process.env; appendFileSync(o,`code_sha=${c}\ncontent_sha=${d}\nrelease_sha=${releaseVersion(c,d)}\n`);'
      - name: Install dependencies once
        working-directory: theme
        run: pnpm install --frozen-lockfile
      - name: Materialize and validate CMS
        working-directory: theme
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
        run: |
          node tools/cms/cli.mjs validate ../content
          node scripts/content/sync.mjs --production
      - name: Validate theme and data
        working-directory: theme
        run: |
          pnpm exec biome ci ./src --reporter=github
          pnpm exec astro check
          pnpm check:manifest
          pnpm type-check
          node --test --test-concurrency=1 "tests/**/*.test.mjs"
          python3 -m unittest discover -s tests/content -p test_cms_scheduler.py
      - name: Build and package production release
        working-directory: theme
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
          CONTENT_SHA: ${{ steps.versions.outputs.content_sha }}
          RELEASE_SHA: ${{ steps.versions.outputs.release_sha }}
          CODE_SHA: ${{ steps.versions.outputs.code_sha }}
          CI: true
        run: |
          pnpm build
          node tools/cms/verify-dist.mjs ../content dist
          node scripts/deploy/package.mjs
      - name: Upload private release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ steps.versions.outputs.release_sha }}
          path: |
            theme/artifacts/release.tar.gz
            theme/artifacts/release.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy blog.zhiii.top
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: shirone-production
      cancel-in-progress: false
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
      CODE_SHA: ${{ needs.build.outputs.code_sha }}
      CONTENT_SHA: ${{ needs.build.outputs.content_sha }}
      CONTENT_READ_TOKEN: ${{ github.token }}
      ALLOW_CONTENT_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.content_sha != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Zhaozhiii/shirone-Zh
          ref: ${{ needs.build.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ needs.build.outputs.release_sha }}
          path: release
      - name: Verify and configure deployment
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          (cd release && sha256sum --check release.tar.gz.sha256)
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_KNOWN_HOSTS" && test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and activate current release
        id: activate
        run: |
          if [ "$(node scripts/deploy/check-current.mjs)" != true ]; then echo 'Superseded; deployment skipped.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release/release.tar.gz "$SERVER_USER@$SERVER_HOST:/srv/shirone-blog/site/incoming/$RELEASE_SHA.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release/release.tar.gz.sha256 "$SERVER_USER@$SERVER_HOST:/srv/shirone-blog/site/incoming/$RELEASE_SHA.tar.gz.sha256"
          if [ "$(node scripts/deploy/check-current.mjs)" != true ]; then echo 'Superseded during upload.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" "/usr/local/bin/shirone-blog-release activate $RELEASE_SHA"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify public release metadata
        if: steps.activate.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error https://blog.zhiii.top/healthz | python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert all(d[k] == os.environ[v] for k,v in [("release","RELEASE_SHA"),("code","CODE_SHA"),("content","CONTENT_SHA")])'
          echo "Published $RELEASE_SHA to https://blog.zhiii.top" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
